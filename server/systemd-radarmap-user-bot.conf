# radarmap-bot не от root (38A, 02.11.2026). Кладётся в
# /etc/systemd/system/radarmap-bot.service.d/user.conf скриптом
# migrate_api_user.sh. Выкладка бота переписывает сам юнит (там User=root), а
# drop-in это переживает: User и пустая ReadWritePaths= здесь главнее.
#
# Бот пишет bot.db и family.db (обе в /opt/radarmap/data, family.db делит с
# api), reports.db читает. telegram_bot.conf (токен) — root:radarmap 640.
[Service]
User=radarmap
Group=radarmap
UMask=0027
CapabilityBoundingSet=
ReadWritePaths=
ReadWritePaths=/opt/radarmap/data
