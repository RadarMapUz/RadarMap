# НЕ ПОСТАВЛЕНО НА СЕРВЕР — ставит владелец руками.
#
# nginx-radarmap-location.conf с 28.10.2026 хранит байт в байт то, что стоит в
# /etc/nginx/snippets/radarmap-location.conf (drift.sh сверяет его md5). Блоки
# ниже были написаны в репо, но на сервер так и не попали; без них всё
# работает через общий `location /radarmap/` (max-age=300) — они только
# уточняют кэш. Чтобы не потерять их и не выдать за действующие, они живут
# здесь, а не в боевом сниппете.
#
# Как поставить (на VPS, домен soulmed.uz — чужой проект, поэтому с бэкапом):
#   cp /etc/nginx/snippets/radarmap-location.conf /etc/nginx/snippets/radarmap-location.conf.bak-<дата>
#   вставить блоки ниже ПЕРЕД строкой `location /radarmap/ {` (общий префикс —
#   последним), заменить комментарий над `location /radarmap/traffic/` на
#   текст из конца этого файла;
#   nginx -t && systemctl reload nginx
# Затем снять файл с сервера в репо:
#   scp radarmap-vps:/etc/nginx/snippets/radarmap-location.conf server/nginx-radarmap-location.conf
# и удалить из этого файла то, что поставлено (bash server/drift.sh → «=»).

# Погода на трассах (server/build_road_weather.py, cron раз в 30 минут):
# weather/roads.json, несколько килобайт. no-cache, как у пробок: файл
# переписывается при смене прогноза и раз в час, а проверка ETag стоит
# телефону пустой 304. Без этого раздела файл отдаёт общий /radarmap/ ниже
# с max-age=300 — тоже работает, только свежесть до 5 минут хуже.
location /radarmap/weather/ {
    limit_req zone=radarmap_static burst=60 nodelay;
    limit_req_status 429;
    alias /opt/radarmap/www/weather/;
    gzip on;
    gzip_types application/json;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_vary on;
    add_header Cache-Control "no-cache";
}

# Слой полос на перекрёстках (server/publish_lanes.sh, план 20.8; контракт —
# docs/lanes_overlay_contract.md). Без этих двух блоков всё работает через
# общий /radarmap/ ниже (max-age=300) — они только уточняют кэш, поэтому
# ставятся руками и не обязаны опережать первую публикацию.
#
# Данные — lanes/lanes.<sha16>.json: имя от содержимого, по адресу байты не
# меняются никогда (новая публикация — новое имя), поэтому кэш на год, как у
# /radarmap/v/. .gz рядом кладёт publish_lanes.sh — gzip_static.
location /radarmap/lanes/ {
    limit_req zone=radarmap_static burst=60 nodelay;
    limit_req_status 429;
    alias /opt/radarmap/www/lanes/;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Индекс — no-cache: он и есть «какой набор сейчас», включая откат. С кэшем
# в пять минут откат доезжал бы до части телефонов на пять минут позже, а
# проверка ETag стоит телефону пустой 304. .gz для индекса не кладётся.
location = /radarmap/lanes/lanes_index.json {
    limit_req zone=radarmap_static burst=60 nodelay;
    limit_req_status 429;
    alias /opt/radarmap/www/lanes/lanes_index.json;
    add_header Cache-Control "no-cache";
}

# --- Комментарий над location /radarmap/traffic/ (сейчас на сервере — старый, про один now.json):
#
# Пробки (server/traffic_build.py, cron раз в 2 минуты): now.json и
# typical/<wd|off>-<час>.json («обычно по водителям», пересборка раз в час,
# файл переписывается только при смене рёбер). no-cache, а не max-age:
# пробка за пять минут кэша уже другая, а проверка ETag стоит телефону
# пустой 304 — для typical то же правило подходит как есть. Сжатие — на
# лету (файлы живые, .gz рядом не лежит).
