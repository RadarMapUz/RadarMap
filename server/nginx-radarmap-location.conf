# RadarMap под чужим доменом: /etc/nginx/snippets/radarmap-location.conf
#
# Подключается ОДНОЙ строкой внутрь существующего server-блока с сертификатом:
#
#     server {
#         server_name soulmed.uz www.soulmed.uz;
#         ...
#         include /etc/nginx/snippets/radarmap-location.conf;   # ← вся правка
#         listen 443 ssl;
#         ...
#     }
#
# Почему включением, а не редактированием чужого конфига: на этом сервере
# живёт не только RadarMap, и откат обязан быть удалением одной строки, а не
# восстановлением из бэкапа под давлением. Существующие location'ы домена не
# затрагиваются: `/radarmap/` — более длинный префикс, чем `/`, и не
# пересекается с `/api/` лендинга (совпадение считается от начала пути).
#
# Зоны limit_req_zone определены на уровне http в conf.d/radarmap.conf и
# действуют глобально — здесь их объявлять не нужно и нельзя.
#
# Порт 8090 остаётся жить параллельно и после переезда: в App Store может уйти
# сборка со старым адресом, и выключить его — значит сломать её без
# возможности починить.

# --- API краудсорса, метрик и обратной связи ---
location /radarmap/api/ {
    limit_req zone=radarmap_api burst=20 nodelay;
    limit_req_status 429;

    client_max_body_size 300k;
    client_body_timeout 10s;

    proxy_pass http://127.0.0.1:8091/api/;
    proxy_read_timeout 15s;
    # ОБА заголовка ставим сами, значением $remote_addr. Это не дублирование:
    # api.py читает их как «настоящий адрес клиента», и любой из них, который
    # мы НЕ перезапишем, приходит от клиента. Подделанный X-Forwarded-For
    # обходит все суточные капы и подделывает кворум «разных адресов».
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# --- Маршрутизация (OSRM в Docker, проброшен на 8092) ---
location /radarmap/osrm/ {
    limit_req zone=radarmap_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8092/;
    proxy_read_timeout 20s;
    proxy_connect_timeout 5s;
}

# --- Панель модератора ---
#
# Слеш на конце proxy_pass снимает префикс на входе: до admin.py доезжает
# «/mobile», а не «/radarmap/admin/mobile». Обратно префикс подставляет сам
# admin.py (RADARMAP_ADMIN_BASE), иначе все ссылки и формы ведут в корень
# домена — то есть на чужой сайт.
#
# Пароль здесь уже не идёт открытым текстом: HTTPS, и require_secure() в
# admin.py начинает пропускать. До сертификата панель была доступна только
# через SSH-туннель — теперь это запасной путь, а не единственный.
location /radarmap/admin/ {
    limit_req zone=radarmap_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8093/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}

# --- Статика: база камер, лимиты, дорожные тайлы, пульт, лендинг ---
location /radarmap/ {
    limit_req zone=radarmap_static burst=60 nodelay;
    limit_req_status 429;

    alias /opt/radarmap/www/;
    index index.html;

    # Сжатие: база камер 1 МБ → ~200 КБ, лимиты 3 МБ → ~600 КБ. Готовые .gz
    # рядом с файлом (их кладёт deploy_db.sh) отдаются как есть — без этого
    # nginx пережимал бы мегабайт на КАЖДУЮ из тысяч загрузок.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_static on;

    # Короткий кэш: OTA не должна ждать вечности, но и долбить сервер незачем.
    add_header Cache-Control "max-age=300";
}
