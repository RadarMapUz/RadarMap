# RadarMap: nginx с сетевыми лимитами (кладётся в /etc/nginx/conf.d/ или sites-enabled).
# Капы per-device живут в api.py; этот слой режет ротацию устройств и флуд по IP.
# После выпуска сертификата (см. HTTPS.md) добавить server-блок :443 и redirect.

# 10 запросов/сек с одного IP на API, всплеск до 20 — честному клиенту хватает
# с запасом (опрос радаров раз в 3 мин, репорты штучные).
limit_req_zone $binary_remote_addr zone=radarmap_api:10m rate=10r/s;
# Статика (база, лимиты): щедрее, но не безлимит.
limit_req_zone $binary_remote_addr zone=radarmap_static:10m rate=30r/s;

server {
    listen 8090;
    # server_name radarmap.example.uz;   # ← вписать домен перед выпуском сертификата

    # Тела больше, чем шлёт приложение (метрики ≤256К), не принимаем.
    client_max_body_size 300k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location /api/ {
        limit_req zone=radarmap_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_read_timeout 15s;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /osrm/ {
        limit_req zone=radarmap_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/;
        proxy_read_timeout 20s;
    }

    location / {
        limit_req zone=radarmap_static burst=60 nodelay;
        limit_req_status 429;
        root /opt/radarmap/www;
        # База и версия — с коротким кэшом, чтобы OTA не ждала CDN-вечность.
        add_header Cache-Control "max-age=300";
    }
}
