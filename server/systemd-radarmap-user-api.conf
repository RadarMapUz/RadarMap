# radarmap-api не от root (38A, 02.11.2026). Кладётся в
# /etc/systemd/system/radarmap-api.service.d/user.conf скриптом
# migrate_api_user.sh — только после переноса баз в /opt/radarmap/data, иначе
# api не откроет reports.db на запись.
#
# Песочница sandbox.conf остаётся; здесь — пользователь и сужение записи.
# Имя user.conf идёт по алфавиту после sandbox.conf, поэтому пустая строка
# ReadWritePaths= сбрасывает её /opt/radarmap, а не наоборот.
#
# Пишет api только базы: reports.db, traffic.db (куски пробок) и family.db
# (очередь близких). Код в /opt/radarmap/api остаётся root и только на чтение:
# этот каталог исполняет cron от root (status.py, traffic_build.py,
# backup_db.sh), и право записи туда у api было бы дорогой к root.
# admin.conf (токен уведомлений) и telegram_bot.conf (имя бота) — чтение.
#
# MemorySwapMax=0: 02.11.2026 у процесса api было 9 МБ в памяти и 12,5 МБ в
# свопе — первый запрос после простоя поднимает страницы с диска, а во время
# customize стенда (900 МБ, копия слота 243 МБ) диск занят. Держать api в
# памяти стоит ~20 МБ ОЗУ.
[Service]
User=radarmap
Group=radarmap
UMask=0027
MemorySwapMax=0
CapabilityBoundingSet=
ReadWritePaths=
ReadWritePaths=/opt/radarmap/data
