# Песочница для radarmap-api и radarmap-admin (drop-in, 27.09.2026).
#
# Оба сервиса работают от root и слушают HTTP из интернета (через nginx).
# Уязвимость в любом из них до этого значила root на ОБЩЕМ VPS — рядом
# Dentalor, postgres, minio. Здесь они видят файловую систему только на
# чтение, а писать могут лишь в /opt/radarmap (reports.db, admin.conf,
# правки конструктора). Подпроцессов не запускают — проверено по коду.
#
# Кладётся в /etc/systemd/system/radarmap-{api,admin}.service.d/sandbox.conf.
# Откат: удалить оба файла, systemctl daemon-reload, restart обоих юнитов.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ReadWritePaths=/opt/radarmap
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
