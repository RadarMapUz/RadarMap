<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Симулятор поездки</title>
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  .panel { position: absolute; padding: 10px 12px; border-radius: 12px; background: rgba(20, 24, 30, 0.82);
           color: #fff; font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; }
  #hud { left: 12px; top: 12px; min-width: 230px; }
  #hud b { font-size: 26px; }
  #hud .row { margin-top: 4px; }
  #hud .hint { color: #8be28b; font-weight: 600; }
  #hud .warn { color: #ffb74d; font-weight: 700; }
  #hud .muted { color: #9aa3ad; font-size: 12px; }
  .lanes { display: flex; gap: 4px; margin-top: 6px; }
  .lane { width: 30px; height: 30px; border-radius: 6px; background: #39424f; display: flex;
          align-items: center; justify-content: center; font-size: 17px; }
  .lane.good { background: #2e7d32; }
  .lane.me { outline: 2px solid #4fc3f7; }
  #controls { right: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 360px; }
  #controls button { background: #39424f; color: #fff; border: 0; border-radius: 8px; padding: 6px 10px;
                     font: inherit; cursor: pointer; }
  #controls label { display: flex; align-items: center; gap: 4px; }
</style>
<div id="map"></div>
<div id="hud" class="panel">загрузка…</div>
<div id="controls" class="panel">
  <button id="pause">❚❚</button>
  <button data-rate="1">×1</button><button data-rate="2">×2</button><button data-rate="4">×4</button>
  <button data-view="chase">За машиной</button><button data-view="top">Сверху</button>
  <button data-view="heli">Вертолёт</button>
  <button id="restart">С начала</button>
  <label><input id="wander" type="checkbox" checked> обгоны</label>
</div>
<script src="maplibre-gl.js"></script>
<script src="drive_sim.js"></script>
