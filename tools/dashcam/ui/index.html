<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разбор видео</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/ui/app.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
<aside id="side">
  <h1>Разбор видео</h1>
  <nav id="tabs">
    <button data-tab="trips" class="on">Поездки</button>
    <button data-tab="finds">Находки</button>
    <button data-tab="label">Разметка</button>
  </nav>
  <div id="trips" class="pane"></div>
  <div id="finds" class="pane" hidden>
    <div class="filters">
      <select id="f-cls"><option value="">все классы</option><option value="traffic_light">светофоры</option>
        <option value="speed_limit">знаки ограничения</option><option value="crossing">переходы</option></select>
      <select id="f-status"><option value="">любой статус</option><option value="new">новое</option>
        <option value="confirms">подтверждает</option><option value="differs">расходится</option></select>
      <select id="f-dec"><option value="">все решения</option><option value="none">без решения</option>
        <option value="accept">принятые</option><option value="reject">отклонённые</option></select>
      <label class="muted">уверенность ≥ <span id="f-conf-v">0.3</span>
        <input id="f-conf" type="range" min="0" max="1" step="0.05" value="0.3"></label>
    </div>
    <div id="finds-count" class="muted"></div>
    <div id="finds-list"></div>
    <div class="muted">A — принять, R — отклонить, ←/→ — соседняя находка</div>
  </div>
  <div id="label" class="pane" hidden>
    <p class="muted">Быстрая разметка для обучения: на вырезке — то, что нашёл черновой детектор.
      Да (Y) — объект этого класса, нет (N), пропустить (S). Номера и лица размыты.</p>
    <select id="l-cls"><option value="">все классы</option><option value="traffic_light">светофоры</option>
      <option value="speed_limit">знаки ограничения</option><option value="crossing">переходы</option></select>
    <div id="label-stats" class="muted"></div>
  </div>
  <form id="import">
    <label for="import-path">Загрузить папку роликов или GPX</label>
    <input id="import-path" placeholder="~/RadarMapBuild/dashcam/morning" autocomplete="off">
    <button type="submit">Импорт</button>
    <div id="import-msg" class="muted"></div>
  </form>
</aside>
<main>
  <div id="banner" hidden></div>
  <div id="map"></div>
  <aside id="card" hidden></aside>
  <div id="labeler" hidden>
    <div id="l-q"></div>
    <img id="l-img" alt="">
    <div id="l-meta" class="muted"></div>
    <div class="l-btns"><button id="l-yes">Да (Y)</button><button id="l-no">Нет (N)</button>
      <button id="l-skip">Пропустить (S)</button></div>
  </div>
  <div id="legend" class="muted"></div>
  <section id="player">
    <div id="screens">
      <video id="va" muted playsinline preload="auto"></video>
      <video id="vb" muted playsinline preload="auto" hidden></video>
      <div id="novideo" class="muted">Выберите поездку слева</div>
    </div>
    <div id="controls">
      <button id="play" disabled title="Пробел">▶</button>
      <input id="seek" type="range" min="0" max="1" step="0.1" value="0" disabled>
      <div id="clock">
        <div id="t-phone">—</div>
        <div id="t-cam" class="muted">—</div>
      </div>
      <label class="muted"><input id="follow" type="checkbox" checked> следовать</label>
    </div>
  </section>
</main>
<script src="/ui/app.js"></script>
<script src="/ui/finds.js"></script>
</body>
</html>
