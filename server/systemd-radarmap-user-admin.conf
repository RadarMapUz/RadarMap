# radarmap-admin не от root (38A, 02.11.2026). Кладётся в
# /etc/systemd/system/radarmap-admin.service.d/user.conf скриптом
# migrate_api_user.sh. Пустая ReadWritePaths= сбрасывает /opt/radarmap из
# sandbox.conf (user.conf читается после него).
#
# Панель пишет reports.db (решения модерации, правки конструктора) и
# admin.conf (секрет сессий, учётки модераторов — запись на месте, O_TRUNC).
# status.db/status.json, traffic.db, /opt/radarmap/www, work/ — только чтение.
# Минус перед admin.conf: без файла юнит всё равно стартует.
[Service]
User=radarmap
Group=radarmap
UMask=0027
CapabilityBoundingSet=
ReadWritePaths=
ReadWritePaths=/opt/radarmap/data -/opt/radarmap/admin.conf
