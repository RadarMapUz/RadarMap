# radarmap.uz — домен RadarMap (26.10.2026). Отдельный файл: откат — удалить
# симлинк /etc/nginx/sites-enabled/radarmap-uz и перезагрузить nginx;
# soulmed.uz и dentalor.uz не задеты.
#
# Домен за прокси Cloudflare: настоящий адрес клиента — в CF-Connecting-IP.
# Без этого все водители выглядели бы горсткой адресов Cloudflare, и сломались
# бы лимиты запросов и «кворум разных IP» у голосов за метки.

server {
    listen 80;
    server_name radarmap.uz www.radarmap.uz;
    location /.well-known/acme-challenge/ { root /var/www/radarmap-acme; }
    location / { return 301 https://radarmap.uz$request_uri; }
}

server {
    listen 443 ssl;
    server_name radarmap.uz www.radarmap.uz;
    ssl_certificate     /etc/letsencrypt/live/radarmap.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radarmap.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    if ($host = www.radarmap.uz) { return 301 https://radarmap.uz$request_uri; }

    # Сайт — те же файлы, что soulmed.uz/radarmap/.
    root /opt/radarmap/www;
    location = /              { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /privacy.html  { add_header Cache-Control "no-cache"; }
    location = /og.jpg        { }
    location /shots/          { }
    location /.well-known/acme-challenge/ { root /var/www/radarmap-acme; }

    # Всё приложение — по тем же путям, что на soulmed.uz: /radarmap/api,
    # /radarmap/osrm, тайлы, база камер. Новая сборка сможет перейти на
    # https://radarmap.uz/radarmap сменой одной строки.
    include /etc/nginx/snippets/radarmap-location.conf;

    # Пока домен по ошибке смотрел на soulmed (до 26.10), браузеры успели
    # закэшировать его страницы (/login и др.) — без Cache-Control на две
    # недели вперёд. Любой запрос мимо сайта просит браузер стереть кэш домена.
    location / {
        add_header Clear-Site-Data "\"cache\"" always;
        return 404;
    }
}
