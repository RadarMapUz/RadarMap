# Боевой конфиг: /etc/nginx/conf.d/radarmap.conf на 45.130.148.94, снят 27.09.2026.
# Прежний файл здесь был шаблоном, который на сервер так и не попал (см. git log).
# HTTPS-вход soulmed.uz/radarmap живёт в nginx-radarmap-location.conf (совпадает с сервером).

# RadarMap static data + crowdsourcing API (isolated, port 8090). Updated 2026-07-19.
# Слой сетевой защиты: per-IP rate-limit (капы per-device живут в api.py),
# отсечка больших тел и медленных клиентов.

limit_req_zone $binary_remote_addr zone=radarmap_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=radarmap_static:10m rate=30r/s;

server {
    listen 8090;
    server_name _;
    root /opt/radarmap/www;

    client_max_body_size 300k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location /osrm/ {
        limit_req zone=radarmap_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://radarmap_osrm/; proxy_next_upstream error timeout http_502 http_503;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # MetricKit: диагностика бывает больше общего потолка тела (см. HTTPS-вход).
    location = /api/metrics {
        limit_req zone=radarmap_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    location /api/ {
        limit_req zone=radarmap_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    location / {
        limit_req zone=radarmap_static burst=60 nodelay;
        limit_req_status 429;
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/json;
        gzip_static on;
        gzip_min_length 1024;
    }
}
